<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: #fff;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
        }
        #ui h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            font-weight: 300;
            opacity: 0.8;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h1>Haz clic en las cajas de regalo ✨</h1>
    </div>
    <div id="webgl-container"></div>

    <script>
        // --- 1. MENSAJES Y CONFIGURACIÓN ---
        const MESSAGES = [
            ¡Felices 21 años! 🌟\n\nHoy me puse a pensar que, por más que vivamos lejos, la luna que ves tú allá es la misma que veo yo acá, un pensamiento que me da paz. Aunque me pesa no estar ahí para brindar, no iba a dejar pasar el día sin decirte algo. Más que los 21, te deseo un año que no se parezca a otro, uno que, al recordarlo, te haga sentir que realmente viviste, que logres no solo objetivos, sino esa calma profunda de saber que valió la pena. Que cada noche de este año, cuando mires hacia arriba, recuerdes que tu luz, como la de las estrellas, es única y llega más lejos de lo que imaginas.\n\n¡Felicidades y disfruta mucho tu día!,
            
            ¡Felices 21 años! 🌙\n\nA veces me detengo a pensar en cómo los años pasan y, aunque los kilómetros nos separen hoy, sé que el tiempo nos sigue encontrando en los mismos recuerdos y en las ganas de vernos crecer. Brindo contigo desde la distancia por esta nueva vuelta al sol. Que estos 21 te traigan sorpresas genuinas, valentía para elegir lo que te hace bien y la certeza de que siempre estoy celebrándote, sin importar el mapa.\n\n¡Disfruta cada segundo de tu día!,
            
            ¡Muy feliz cumpleaños! ✨\n\nEstaba pensando en ti y en cómo, a pesar de la distancia, hay cosas que no cambian: nuestra complicidad sigue intacta. Aunque me muero por darte ese abrazo en persona, me consuela saber que sigo estando cerquita en tus momentos importantes. Que este año de vida te regale risas imprevistas, aprendizajes bonitos y esa paz que te hace sentir en casa, estés donde estés.\n\n¡Pásala increíble y come mucho pastel por mí!,
            
            ¡Felices 21! 🌟\n\nQué bonito es verte llegar a esta edad con tanta luz y tantas ganas de comerte el mundo. Aunque hoy no podamos brindar cara a cara, quiero que sepas que mis mejores deseos vuelan directo hacia ti. Que este año te atrevas a lo nuevo, que rompas tus propios límites y que cada vez que mires al cielo, recuerdes que hay alguien muy orgulloso de ti aplaudiéndote desde lejos.\n\n¡Felicidades y que sea tu mejor año hasta ahora!,
            
            ¡Felices 21 años! 🌌\n\nHoy el día se siente diferente, y aunque me encantaría estar ahí para celebrarte en persona, la distancia se siente un poquito más corta sabiendo cuánto te quiero. Que este nuevo año te sorprenda con momentos sencillos pero inolvidables, con abrazos que curen cualquier ausencia y con la absoluta certeza de que vas por el camino correcto.\n\n¡Que tengas un día tan bonito como tú!,
            
            ¡Muchas felicidades en tus 21! ✨\n\nEstaba pensando en lo rápido que pasa el tiempo y en lo orgulloso(a) que estoy de la persona en la que te has convertido. Aunque hoy nos toque celebrar a través de una pantalla, brindo por ti, por tus sueños y por todo lo bonito que está por venir a tu vida. Que este año te de los triunfos que buscas y la paz que mereces.\n\n¡Disfruta al máximo tu día, te mando un abrazo gigante hasta allá!
        ];

        // --- 2. ESCENA THREE.JS ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 60;
        controls.minDistance = 10;

        // --- 3. FONDO DE ESTRELLAS (ESTILO IMAGEN) ---
        function createStarfield() {
            const starCount = 3000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 200;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 200;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 200;
                sizes[i] = Math.random() * 2 + 0.5;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            // Crear textura cuadrada pequeña para estrellas estilo la imagen
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(2, 2, 12, 12);
            const starTexture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.2,
                map: starTexture,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            const starField = new THREE.Points(geometry, material);
            scene.add(starField);
        }
        createStarfield();

        // --- 4. CAJAS DE REGALO FLOTANTES ---
        const boxesGroup = new THREE.Group();
        scene.add(boxesGroup);
        const clickableObjects = [];

        function createGiftBox(index, x, y, z) {
            const boxGroup = new THREE.Group();
            boxGroup.position.set(x, y, z);

            // Cuerpo del regalo
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshPhongMaterial({
                color: 0xff3366,
                emissive: 0x220011,
                shininess: 80
            });
            const boxMesh = new THREE.Mesh(geometry, material);
            boxGroup.add(boxMesh);

            // Listón Dorado
            const ribbonMat = new THREE.MeshPhongMaterial({ color: 0xffd700, shininess: 100 });
            const ribbon1 = new THREE.Mesh(new THREE.BoxGeometry(2.1, 2.05, 0.4), ribbonMat);
            const ribbon2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.05, 2.1), ribbonMat);
            boxGroup.add(ribbon1);
            boxGroup.add(ribbon2);

            // Datos interactivos
            boxGroup.userData = { id: index, opened: false, originalY: y };
            boxesGroup.add(boxGroup);
            clickableObjects.push(boxMesh);

            return boxGroup;
        }

        // Posicionar 6 regalos alrededor del centro
        const radius = 14;
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = (Math.random() - 0.5) * 4;
            createGiftBox(i, x, y, z);
        }

        // --- 5. ILUMINACIÓN ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff69b4, 2, 50);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // --- 6. TEXTO ORBITAL EN EL ESPACIO (ESTILO IMAGEN) ---
        const textOrbitGroup = new THREE.Group();
        scene.add(textOrbitGroup);

        function createSpaceTextTexture(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024;
            canvas.height = 512;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'Bold 28px "Segoe UI", Arial, sans-serif';
            ctx.fillStyle = '#ffb6c1';
            ctx.shadowColor = '#ff1493';
            ctx.shadowBlur = 12;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Dividir en líneas
            const lines = text.split('\n');
            let startY = canvas.height / 2 - (lines.length * 18);
            lines.forEach((line, i) => {
                ctx.fillText(line, canvas.width / 2, startY + (i * 38));
            });

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function spawnSpaceText(text, pos) {
            const texture = createSpaceTextTexture(text);
            const planeGeo = new THREE.PlaneGeometry(16, 8);
            const planeMat = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const textMesh = new THREE.Mesh(planeGeo, planeMat);

            textMesh.position.copy(pos);
            textMesh.scale.set(0.01, 0.01, 0.01);
            textOrbitGroup.add(textMesh);

            // Animación de aparición
            let scale = 0.01;
            const expand = setInterval(() => {
                scale += 0.05;
                textMesh.scale.set(scale, scale, scale);
                if (scale >= 1) clearInterval(expand);
            }, 16);
        }

        // --- 7. FUEGOS ARTIFICIALES EN 3D ---
        const fireworks = [];

        function createFirework(position) {
            const particleCount = 120;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = [];

            const colors = [0xff69b4, 0xff1493, 0xffd700, 0x00ffff, 0xffffffff];
            const color = colors[Math.floor(Math.random() * colors.length)];

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = position.x;
                positions[i * 3 + 1] = position.y;
                positions[i * 3 + 2] = position.z;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = Math.random() * 0.6 + 0.2;

                velocities.push(new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta) * speed,
                    Math.sin(phi) * Math.sin(theta) * speed,
                    Math.cos(phi) * speed
                ));
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                size: 0.5,
                color: color,
                transparent: true,
                opacity: 1,
                blending: THREE.AdditiveBlending
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            fireworks.push({
                mesh: particles,
                velocities: velocities,
                life: 1.0
            });
        }

        function updateFireworks() {
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                const positions = fw.mesh.geometry.attributes.position.array;

                for (let j = 0; j < fw.velocities.length; j++) {
                    positions[j * 3] += fw.velocities[j].x;
                    positions[j * 3 + 1] += fw.velocities[j].y;
                    positions[j * 3 + 2] += fw.velocities[j].z;
                }

                fw.mesh.geometry.attributes.position.needsUpdate = true;
                fw.life -= 0.015;
                fw.mesh.material.opacity = fw.life;

                if (fw.life <= 0) {
                    scene.remove(fw.mesh);
                    fireworks.splice(i, 1);
                }
            }
        }

        // --- 8. INTERACCIÓN (RAYCASTER) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);

            if (intersects.length > 0) {
                const boxGroup = intersects[0].object.parent;
                if (!boxGroup.userData.opened) {
                    boxGroup.userData.opened = true;

                    // Crear explosión de fuegos artificiales
                    createFirework(boxGroup.position);
                    setTimeout(() => createFirework(boxGroup.position), 200);

                    // Hacer aparecer texto flotando en el espacio
                    spawnSpaceText(MESSAGES[boxGroup.userData.id], boxGroup.position);

                    // Ocultar caja
                    boxGroup.visible = false;
                }
            }
        });

        // --- 9. BUCLE DE ANIMACIÓN ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Rotar el grupo entero de textos flotantes para simular el giro de frases en el espacio
            textOrbitGroup.rotation.y += 0.002;
            boxesGroup.rotation.y += 0.001;

            // Balanceo individual de las cajas de regalo
            boxesGroup.children.forEach((box, idx) => {
                box.position.y = box.userData.originalY + Math.sin(elapsedTime * 2 + idx) * 0.5;
                box.rotation.y += 0.01;
            });

            // Orientar textos hacia la cámara para que siempre sean legibles
            textOrbitGroup.children.forEach(textMesh => {
                textMesh.lookAt(camera.position);
            });

            updateFireworks();
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- 10. REAJUSTE DE VENTANA ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
